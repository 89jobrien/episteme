[package]
name = "episteme-local"
version = "0.2.0"
edition = "2024"
description = "Local-first knowledge ingestion and intelligence workflows"
license = "MIT OR Apache-2.0"
authors = ["Joseph O'Brien"]
repository = "https://github.com/89jobrien/episteme"
documentation = "https://docs.rs/episteme-local"
readme = "README.md"
keywords = ["document-ingestion", "knowledge-management", "obsidian", "local-first", "research"]
categories = ["command-line-utilities", "text-processing", "database"]
publish = ["crates-io"]
exclude = [".ctx/", "AGENTS.md", "docs/designs/"]

[lib]
name = "episteme"
path = "src/lib.rs"

[[bin]]
name = "episteme"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
baml = "=0.221.0"
blake3 = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
duckdb = { version = "=1.10505.0", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.9"
url = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
