# Release configuration for cargo-rail.
#
# cargo-rail owns the mechanical part of a release: the Cargo.toml and
# Cargo.lock version bump, the release commit, the tag, and the crates.io
# upload. The changelog stays hand-authored -- see the changelog section below.
#
# Regenerate the full default set with:
#   cargo rail release init episteme-local --check
targets = []

[unify]
include_paths = true
include_renamed = false
exclude = []
include = []
max_backups = 3
consumer_scope = "open"
preserve_features = []
strict_version_compat = true
exact_pin_handling = "warn"
major_version_conflict = "warn"
skip_undeclared_patterns = [
    "default",
    "std",
    "alloc",
    "*_backend",
    "*_impl",
]

[release]
# Plan from conventional commit subjects. cargo-rail 0.25.0 changed the default
# to ReleaseSource::Changes, which makes `.changes` files mandatory for any crate
# with code changes. This repo has never used that directory and plans from
# commits, so the default would fail every release with
# "missing change files for episteme-local: code changes require .changes coverage".
source = "commits"
# cargo-rail 0.25.0 split publication away from git and forge effects, then
# coupled them back together as a safety interlock: --publish is refused while
# remote_effects = "none" (registry_publication_skipped in
# src/commands/release.rs). The same guard is present at 0.30.1, so this is
# deliberate design rather than a version quirk.
#
# The old `push = false` is not removed -- it is a deprecated compatibility field
# that resolves to remote_effects = "none" (see ReleaseConfig's deserializer).
# It is therefore not an alternative here; it is the same incompatible state.
# Mixing remote_effects with push, create_github_release, or forge is a hard
# parse error, which is why `cargo rail config migrate` removed them.
#
# Full rail automation, chosen deliberately over the manual-push model that
# 0.17.3's `push = false` expressed. Consequences, all accepted:
#   * rail now pushes the release commit and the tag itself, so git lands
#     BEFORE the crates.io upload (PUSH_RELEASE_COMMIT precedes PUBLISH_CRATE).
#     The verify-then-push order used for 0.2.0 is deliberately abandoned.
#   * the plan inserts AWAIT_EXACT_SHA_CHECKS. This repo has no .github
#     workflows, so that gate currently has nothing to bind to; it is planned
#     with poll = false and should not block, but it is unverified against a
#     real apply.
# Neither is a reason to keep an older cargo-rail: the 0.17.3 resume path could
# not upload at all.
remote_effects = "push"
registry_publication = "crates-io"
tag_prefix = "v"
# The default is "{crate}-{prefix}{version}", which would tag releases
# episteme-local-v0.2.0. The history already uses bare v-prefixed tags
# (v0.1.0, v0.1.1), so match them.
tag_format = "{prefix}{version}"
sign_tags = false
require_changelog_entries = false
# Defaults to true and points at release-notes/, which this repo does not
# have. CHANGELOG.md is the release-notes artifact here.
require_release_notes = false
release_notes_dir = "release-notes"
change_dir = ".changes"
pre_1_breaking_bump = "minor"
unconventional_commits = "warn"
semver_check = "warn"
require_change_files = false

[release.version_groups]

[release.changelog]
path = "CHANGELOG.md"
relative_to = "crate"
entry_format = "- {scope}{breaking}{description}{prs} ({sha_link})"
emoji = true
group_order = [
    "breaking",
    "feat",
    "fix",
    "build",
    "chore",
    "ci",
    "deps",
    "docs",
    "other",
    "perf",
    "refactor",
    "style",
    "test",
]
fallback = "other"
groups = []

[release.changelog.filters]
skip_types = []
skip_scopes = []
include_paths = []
exclude_paths = []

# Removed under cargo-rail 0.25.0:
#
#   [change-detection] / [change-detection.custom] -- drove commit analysis for
#     changelog generation. Irrelevant here: this crate sets
#     crates.episteme-local.changelog.skip = true, so rail never writes
#     CHANGELOG.md. The notes are hand-authored.
#
#   [run.profile] / [run.workflow] -- cargo-rail no longer owns task running.
#     Its replacement guidance is to execute Cargo and cargo-nextest directly
#     and keep repository tasks in Just. This repo already does that: see the
#     `ci` recipe in justfile.
#
# Nothing about the bump, commit, tag, or upload path depended on either.

[crates.episteme-local.release]
publish = true

[crates.episteme-local.changelog]
path = "CHANGELOG.md"
# The per-crate changelog switch, and the load-bearing setting in this file.
#
# cargo-rail's generated changelog is unusable for this repo. It derives
# entries from commit subjects, and the feature work in 0.2.0 landed in
# 17998d4 "chore: checkpoint workspace and Rust documentation" -- typed as a
# chore despite carrying 7k lines of shipped features, so an auto-generated
# section would describe the release as chores only. It also appends its
# section below the older releases rather than replacing the Unreleased
# heading, which would strand the real notes.
#
# So rail never writes CHANGELOG.md. The notes are written by hand under
# "## Unreleased" and cut to a dated section by scripts/promote-changelog.sh,
# which only retitles the heading and never edits entry text.
skip = true
groups = []
